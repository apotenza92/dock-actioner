name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run release tool tests
        run: |
          python3 -m unittest discover -s scripts/release/tests -v
          python3 -m py_compile scripts/release/*.py
          current_tag="$(python3 -c 'import pathlib,re; print(re.search(r"^## \[(v[0-9][^]]*)\]$", pathlib.Path("CHANGELOG.md").read_text(), re.MULTILINE).group(1))')"
          python3 scripts/release/validate_release_contract.py --tag "$current_tag"

      - name: Run decision-engine tests
        run: ./scripts/run_decision_engine_tests.sh

  native-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host_arch: arm64
            xcode_arch: arm64
          - runner: macos-15-intel
            host_arch: x86_64
            xcode_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project Dockmint.xcodeproj \
            -scheme Dockmint \
            -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Run XCTest natively
        run: |
          xcodebuild test \
            -project Dockmint.xcodeproj \
            -scheme Dockmint \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            ARCHS="${{ matrix.xcode_arch }}" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO

      - name: Build stable and beta contracts
        shell: bash
        run: |
          set -euo pipefail
          for channel in stable beta; do
            if [[ "$channel" == beta ]]; then
              product="Dockmint Beta"
              bundle_id="pzc.Dockmint.beta"
              icon="AppIconBeta"
            else
              product="Dockmint"
              bundle_id="pzc.Dockmint"
              icon="AppIcon"
            fi
            derived="$RUNNER_TEMP/DerivedData-$channel"
            xcodebuild \
              -project Dockmint.xcodeproj \
              -scheme Dockmint \
              -configuration Release \
              -destination 'generic/platform=macOS' \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
              -derivedDataPath "$derived" \
              PRODUCT_NAME="$product" \
              PRODUCT_BUNDLE_IDENTIFIER="$bundle_id" \
              ASSETCATALOG_COMPILER_APPICON_NAME="$icon" \
              SU_FEED_URL="https://raw.githubusercontent.com/apotenza92/dockmint/main/appcasts/$channel-${{ matrix.host_arch == 'x86_64' && 'x64' || 'arm64' }}.xml" \
              ARCHS="${{ matrix.xcode_arch }}" \
              ONLY_ACTIVE_ARCH=YES \
              CODE_SIGNING_ALLOWED=NO \
              build
            executable="$derived/Build/Products/Release/$product.app/Contents/MacOS/$product"
            test "$(lipo -archs "$executable")" = "${{ matrix.xcode_arch }}"
          done
