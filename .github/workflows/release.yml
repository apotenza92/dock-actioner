name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: dockmint-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      version_core: ${{ steps.meta.outputs.version_core }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      build_number: ${{ steps.meta.outputs.build_number }}
      release_matrix: ${{ steps.meta.outputs.release_matrix }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Prove tag commit belongs to the approved release source
        env:
          APPROVED_RELEASE_BRANCH: main
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEFAULT_BRANCH" != "$APPROVED_RELEASE_BRANCH" ]]; then
            echo "::error::Repository default branch $DEFAULT_BRANCH is not approved release source $APPROVED_RELEASE_BRANCH"
            exit 1
          fi
          [[ "$(git rev-parse HEAD)" == "$RELEASE_SHA" ]]
          [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" == "$RELEASE_SHA" ]]
          git show-ref --verify --quiet "refs/remotes/origin/$APPROVED_RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "refs/remotes/origin/$APPROVED_RELEASE_BRANCH"; then
            echo "::error::Release tag $RELEASE_TAG does not belong to $APPROVED_RELEASE_BRANCH"
            exit 1
          fi

      - name: Resolve and validate release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release/release_metadata.py --tag "$RELEASE_TAG" --github-output
          python3 scripts/release/validate_release_contract.py --tag "$RELEASE_TAG"
          python3 scripts/release_notes_from_changelog.py --tag "$RELEASE_TAG" >/dev/null

  build-macos:
    needs: prepare
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    environment: release-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"

      - name: Build, sign, notarize, and package
        shell: bash
        env:
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CORE: ${{ needs.prepare.outputs.version_core }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          for variable in \
            APPLE_SIGNING_CERTIFICATE_P12_BASE64 \
            APPLE_SIGNING_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_CERTIFICATE_SHA256 \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID \
            APPLE_NOTARYTOOL_KEY_ID \
            APPLE_NOTARYTOOL_ISSUER_ID \
            APPLE_NOTARYTOOL_KEY_P8_BASE64; do
            test -n "${!variable:-}" || { echo "::error::Missing $variable"; exit 1; }
          done

          SECURE_DIR="$(mktemp -d "$RUNNER_TEMP/dockmint-release.XXXXXX")"
          chmod 700 "$SECURE_DIR"
          KEYCHAIN="$SECURE_DIR/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_PATH="$SECURE_DIR/signing.p12"
          P8_PATH="$SECURE_DIR/AuthKey_${APPLE_NOTARYTOOL_KEY_ID}.p8"
          CERT_PATH="$SECURE_DIR/leaf.pem"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain#\"}"
            keychain="${keychain%\"}"
            ORIGINAL_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//')
          cleanup() {
            if (( ${#ORIGINAL_KEYCHAINS[@]} )); then
              security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || true
            fi
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$SECURE_DIR"
          }
          trap cleanup EXIT

          export P12_PATH P8_PATH
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          for path_name, environment_name in (
              ("P12_PATH", "APPLE_SIGNING_CERTIFICATE_P12_BASE64"),
              ("P8_PATH", "APPLE_NOTARYTOOL_KEY_P8_BASE64"),
          ):
              path = Path(os.environ[path_name])
              path.write_bytes(base64.b64decode(os.environ[environment_name], validate=True))
              path.chmod(0o600)
          PY
          openssl pkcs12 -in "$P12_PATH" -clcerts -nokeys \
            -passin env:APPLE_SIGNING_CERTIFICATE_PASSWORD -out "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          actual_fingerprint="$(openssl x509 -in "$CERT_PATH" -outform DER | shasum -a 256 | awk '{print toupper($1)}')"
          expected_fingerprint="$(printf '%s' "$APPLE_SIGNING_CERTIFICATE_SHA256" | tr -cd '[:xdigit:]' | tr '[:lower:]' '[:upper:]')"
          test "$actual_fingerprint" = "$expected_fingerprint"
          subject="$(openssl x509 -in "$CERT_PATH" -noout -subject -nameopt RFC2253)"
          [[ "$subject" == *"CN=$APPLE_SIGNING_IDENTITY"* ]]
          [[ "$subject" == *"OU=$APPLE_TEAM_ID"* ]]

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" "${ORIGINAL_KEYCHAINS[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$APPLE_SIGNING_IDENTITY"

          SOURCE_PACKAGES="$RUNNER_TEMP/SourcePackages-${{ matrix.channel }}-${{ matrix.arch }}"
          xcodebuild -project Dockmint.xcodeproj -scheme Dockmint \
            -resolvePackageDependencies -clonedSourcePackagesDirPath "$SOURCE_PACKAGES"
          ARCHIVE="$RUNNER_TEMP/${{ matrix.package_prefix }}-${{ matrix.arch }}.xcarchive"
          EXPORT="$RUNNER_TEMP/export-${{ matrix.package_prefix }}-${{ matrix.arch }}"
          EXPORT_OPTIONS="$SECURE_DIR/export-options.plist"
          xcodebuild -project Dockmint.xcodeproj -scheme Dockmint -configuration Release \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -archivePath "$ARCHIVE" archive \
            ARCHS="${{ matrix.xcode_arch }}" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION_CORE" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DOCKMINT_PRODUCT_NAME="${{ matrix.product_name }}" \
            DOCKMINT_BUNDLE_IDENTIFIER="${{ matrix.bundle_id }}" \
            DOCKMINT_APP_ICON_NAME="${{ matrix.app_icon }}" \
            DOCKMINT_FEED_URL="https://raw.githubusercontent.com/apotenza92/dockmint/main/appcasts/${{ matrix.channel }}-${{ matrix.arch }}.xml" \
            OTHER_CODE_SIGN_FLAGS='--timestamp'
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>developer-id</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>${APPLE_SIGNING_IDENTITY}</string>
          <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportPath "$EXPORT" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          APP="$EXPORT/${{ matrix.product_name }}.app"
          test -d "$APP"
          NOTARY_UPLOAD="$SECURE_DIR/notary-upload.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$NOTARY_UPLOAD"
          SUBMIT_JSON="$SECURE_DIR/notary-submit.json"
          xcrun notarytool submit "$NOTARY_UPLOAD" \
            --key "$P8_PATH" --key-id "$APPLE_NOTARYTOOL_KEY_ID" \
            --issuer "$APPLE_NOTARYTOOL_ISSUER_ID" --wait --output-format json > "$SUBMIT_JSON"
          submission_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id", ""))' "$SUBMIT_JSON")"
          submission_status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status", ""))' "$SUBMIT_JSON")"
          test -n "$submission_id"
          mkdir -p out evidence
          NOTARY_LOG="evidence/notary-${{ matrix.channel }}-${{ matrix.arch }}.json"
          xcrun notarytool log "$submission_id" \
            --key "$P8_PATH" --key-id "$APPLE_NOTARYTOOL_KEY_ID" \
            --issuer "$APPLE_NOTARYTOOL_ISSUER_ID" --output-format json > "$NOTARY_LOG"
          python3 -c 'import sys; sys.path.insert(0,"scripts/release"); from verify_macos_package import validate_notarization_log; from pathlib import Path; validate_notarization_log(Path(sys.argv[1]))' "$NOTARY_LOG"
          test "$submission_status" = Accepted
          xcrun stapler staple -v "$APP"

          PACKAGE="${{ matrix.package_prefix }}-v${VERSION}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "out/$PACKAGE"
          (cd out && shasum -a 256 "$PACKAGE" > "$PACKAGE.sha256")

      - name: Verify package without credentials
        shell: bash
        env:
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          PACKAGE="${{ matrix.package_prefix }}-v${VERSION}-macos-${{ matrix.arch }}.zip"
          NOTARY_LOG="evidence/notary-${{ matrix.channel }}-${{ matrix.arch }}.json"
          python3 scripts/release/verify_macos_package.py \
            --zip "out/$PACKAGE" --checksum "out/$PACKAGE.sha256" \
            --notarization-log "$NOTARY_LOG" \
            --channel "${{ matrix.channel }}" --arch "${{ matrix.arch }}" \
            --version "$VERSION" --build-number "$BUILD_NUMBER" \
            --identity "$APPLE_SIGNING_IDENTITY" --team-id "$APPLE_TEAM_ID" \
            --certificate-sha256 "$APPLE_SIGNING_CERTIFICATE_SHA256"

      - name: Attest release package provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: out/*.zip

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-macos-${{ matrix.channel }}-${{ matrix.arch }}
          path: |
            out/*.zip
            out/*.sha256
          if-no-files-found: error

      - name: Upload notarization evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: notarization-${{ matrix.channel }}-${{ matrix.arch }}
          path: evidence/*.json
          if-no-files-found: warn
          retention-days: 90

  stage-draft-release:
    needs:
      - prepare
      - build-macos
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: dist
      - name: Build deterministic tap-owned Homebrew bundle from local candidate assets
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release/stage_homebrew_publication.py --tag "$TAG" --assets dist --output staged-homebrew
          python3 scripts/create-homebrew-archive.py staged-homebrew/publication dist/homebrew-publication.tar.gz
      - name: Attest the standard Homebrew publication bundle before publication
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/homebrew-publication.tar.gz
      - name: Create exact draft asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          python3 scripts/release_notes_from_changelog.py --tag "$TAG" > "$NOTES"

          EXPECTED="$RUNNER_TEMP/expected-assets.txt"
          prefixes=(Dockmint-Beta)
          if [[ "$PRERELEASE" != "true" ]]; then
            prefixes=(Dockmint "${prefixes[@]}")
          fi
          for prefix in "${prefixes[@]}"; do
            for arch in arm64 x64; do
              printf '%s\n' "${prefix}-v${VERSION}-macos-${arch}.zip"
              printf '%s\n' "${prefix}-v${VERSION}-macos-${arch}.zip.sha256"
            done
          done | { cat; printf '%s\n' homebrew-publication.tar.gz; } | sort > "$EXPECTED"
          find dist -maxdepth 1 -type f -exec basename {} \; | sort > "$RUNNER_TEMP/local-assets.txt"
          diff -u "$EXPECTED" "$RUNNER_TEMP/local-assets.txt"

          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true || {
              echo "::error::Refusing to mutate an already-published release"
              exit 1
            }
          else
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --draft --prerelease --repo "$GH_REPO"
            else
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --draft --repo "$GH_REPO"
            fi
          fi

          RELEASE_ID="$(gh release view "$TAG" --repo "$GH_REPO" --json databaseId --jq .databaseId)"
          test -n "$RELEASE_ID"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sort > "$RUNNER_TEMP/remote-before.txt"
          if comm -13 "$EXPECTED" "$RUNNER_TEMP/remote-before.txt" | grep -q .; then
            echo "::error::Draft contains unexpected assets"
            comm -13 "$EXPECTED" "$RUNNER_TEMP/remote-before.txt"
            exit 1
          fi

          while IFS= read -r asset; do
            if grep -Fxq "$asset" "$RUNNER_TEMP/remote-before.txt"; then
              existing="$RUNNER_TEMP/existing-$asset"
              gh release download "$TAG" --repo "$GH_REPO" --pattern "$asset" --dir "$RUNNER_TEMP"
              mv "$RUNNER_TEMP/$asset" "$existing"
              cmp "dist/$asset" "$existing"
            else
              gh release upload "$TAG" "dist/$asset" --repo "$GH_REPO"
            fi
          done < "$EXPECTED"

          gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.assets[].name' | sort > "$RUNNER_TEMP/remote-after.txt"
          diff -u "$EXPECTED" "$RUNNER_TEMP/remote-after.txt"
          mkdir "$RUNNER_TEMP/redownloaded"
          gh release download "$TAG" --repo "$GH_REPO" --dir "$RUNNER_TEMP/redownloaded"
          while IFS= read -r asset; do cmp "dist/$asset" "$RUNNER_TEMP/redownloaded/$asset"; done < "$EXPECTED"
          for checksum in "$RUNNER_TEMP"/redownloaded/*.sha256; do
            (cd "$RUNNER_TEMP/redownloaded" && shasum -a 256 -c "$(basename "$checksum")")
          done
          mkdir review-input
          cp dist/*.zip review-input/
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > review-input/candidate-release.json
      - name: Upload reviewed draft inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-draft-inputs
          path: review-input
          if-no-files-found: error

  generate-signed-appcasts:
    needs:
      - prepare
      - stage-draft-release
    permissions:
      contents: read
    environment: sparkle-signing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Install pinned public dependencies
        run: python3 -m pip install --quiet 'cryptography==45.0.7'
      - name: Download reviewed draft inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-draft-inputs
          path: candidate-assets
      - name: Generate signed candidate appcasts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          python3 scripts/release/update_sparkle_appcasts.py \
            --repo "${{ github.repository }}" --output-dir generated-appcasts \
            --github-token "$GITHUB_TOKEN" --require-signatures \
            --candidate-tag "${{ needs.prepare.outputs.tag }}" \
            --candidate-release-json candidate-assets/candidate-release.json \
            --asset-cache-dir candidate-assets
      - name: Download any N-1 assets retained by stable feeds
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse

          assets = Path("candidate-assets")
          for feed in Path("generated-appcasts").glob("*.xml"):
              enclosure = ET.parse(feed).getroot().find("./channel/item/enclosure")
              if enclosure is None or not enclosure.get("url"):
                  raise SystemExit(f"{feed} has no enclosure")
              url = enclosure.get("url")
              destination = assets / Path(urlparse(url).path).name
              if not destination.exists():
                  urllib.request.urlretrieve(url, destination)
          PY
      - name: Verify bundled public key, signatures, and tamper rejection
        run: |
          python3 scripts/release/verify_sparkle_appcasts.py \
            --info-plist Dockmint/Info.plist \
            --appcast-dir generated-appcasts \
            --asset-dir candidate-assets
      - name: Upload reviewed appcasts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signed-appcasts
          path: generated-appcasts/*.xml
          if-no-files-found: error

  sparkle-update-gate:
    needs:
      - prepare
      - generate-signed-appcasts
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout reviewed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"
      - name: Download reviewed appcasts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-appcasts
          path: signed-appcasts
      - name: Download reviewed draft inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-draft-inputs
          path: candidate-assets
      - name: Download candidate and current N-1 package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir packages
          candidate="${{ matrix.package_prefix }}-v${VERSION}-macos-${{ matrix.arch }}.zip"
          cp "candidate-assets/$candidate" packages/
          current_feed="https://raw.githubusercontent.com/${{ github.repository }}/main/appcasts/${{ matrix.channel }}-${{ matrix.arch }}.xml"
          previous_url="$(python3 - "$current_feed" <<'PY'
          import sys, urllib.request, xml.etree.ElementTree as ET
          with urllib.request.urlopen(sys.argv[1], timeout=30) as response:
              root = ET.fromstring(response.read())
          enclosure = root.find('./channel/item/enclosure')
          if enclosure is None or not enclosure.get('url'):
              raise SystemExit('current appcast has no enclosure')
          print(enclosure.get('url'))
          PY
          )"
          curl --fail --location --retry 3 "$previous_url" --output packages/previous.zip
      - name: Run N-1 Sparkle install and relaunch gate
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for variable in \
            APPLE_SIGNING_CERTIFICATE_SHA256 \
            APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256 \
            APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID; do
            test -n "${!variable:-}" || { echo "::error::Missing $variable"; exit 1; }
          done
          python3 scripts/release/run_sparkle_update_gate.py \
            --previous-zip packages/previous.zip \
            --candidate-zip "packages/${{ matrix.package_prefix }}-v${VERSION}-macos-${{ matrix.arch }}.zip" \
            --candidate-appcast "signed-appcasts/${{ matrix.channel }}-${{ matrix.arch }}.xml" \
            --channel "${{ matrix.channel }}" --arch "${{ matrix.arch }}" \
            --expected-version "$VERSION" \
            --identity "$APPLE_SIGNING_IDENTITY" --team-id "$APPLE_TEAM_ID" \
            --candidate-certificate-sha256 "$APPLE_SIGNING_CERTIFICATE_SHA256" \
            --prior-certificate-sha256 "$APPLE_PRIOR_SIGNING_CERTIFICATE_SHA256"

      - name: Retain updater diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sparkle-gate-${{ matrix.channel }}-${{ matrix.arch }}
          path: sparkle-gate-diagnostics
          retention-days: 14

  publish-release:
    needs:
      - prepare
      - sparkle-update-gate
    permissions:
      contents: write
    environment: ${{ needs.prepare.outputs.prerelease == 'true' && 'beta-release' || 'stable-release' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft --jq .isDraft)" = true
          gh release edit "$TAG" --repo "$GH_REPO" \
            --draft=false --prerelease="$PRERELEASE" \
            --latest="$([[ "$PRERELEASE" == true ]] && echo false || echo true)"
  prepare-sparkle-publication:
    needs:
      - prepare
      - generate-signed-appcasts
      - publish-release
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Download reviewed appcasts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: signed-appcasts
          path: publication/appcasts
      - name: Seal appcast publication bundle
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          files="$(find publication/appcasts -maxdepth 1 -type f -name '*.xml' -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$files" == 'beta-arm64.xml beta-x64.xml stable-arm64.xml stable-x64.xml' ]]
          (
            cd publication
            find appcasts -type f -name '*.xml' -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          printf '%s\n' \
            "Dockmint appcast publication bundle" \
            "release-tag=${TAG}" \
            "release-commit=${{ github.sha }}" \
            "destination=appcasts/" \
            "Apply these exact reviewed bytes manually after the release approval gate." \
            > publication/PUBLICATION.txt
      - name: Upload appcast publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dockmint-appcast-publication-${{ needs.prepare.outputs.tag }}
          path: publication
          if-no-files-found: error
          retention-days: 14

  generate-homebrew-casks:
    needs:
      - prepare
      - publish-release
      - prepare-sparkle-publication
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Generate exact candidate casks once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reviewed-homebrew/Casks
          python3 scripts/release/update_homebrew_tap_casks.py \
            --tap-path reviewed-homebrew --repo apotenza92/dockmint
          casks="$(find reviewed-homebrew/Casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'dockmint.rb dockmint@beta.rb' ]]
      - name: Upload exact candidate casks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewed-homebrew-casks
          path: reviewed-homebrew/Casks
          if-no-files-found: error

  validate-homebrew-casks:
    needs:
      - prepare
      - generate-homebrew-casks
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            host_arch: arm64
          - runner: macos-15-intel
            host_arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Dockmint
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = "${{ matrix.host_arch }}"
      - name: Download exact candidate casks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-homebrew-casks
          path: reviewed-casks
      - name: Install candidate bytes into a real Homebrew tap
        run: |
          set -euo pipefail
          casks="$(find reviewed-casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'dockmint.rb dockmint@beta.rb' ]]
          brew tap apotenza92/tap
          tap_path="$(brew --repository apotenza92/tap)"
          cp reviewed-casks/dockmint.rb "$tap_path/Casks/dockmint.rb"
          cp reviewed-casks/dockmint@beta.rb "$tap_path/Casks/dockmint@beta.rb"
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew style --cask apotenza92/tap/dockmint apotenza92/tap/dockmint@beta
          brew audit --cask --online apotenza92/tap/dockmint apotenza92/tap/dockmint@beta
      - name: Install, assess, launch, and uninstall both channels
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          installed_cask=''
          cleanup() {
            if [[ -n "$installed_cask" ]]; then
              brew uninstall --cask "$installed_cask" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          for cask in dockmint dockmint@beta; do
            installed_cask="apotenza92/tap/$cask"
            brew install --cask "$installed_cask"
            if [[ "$cask" == dockmint ]]; then app="/Applications/Dockmint.app"; else app="/Applications/Dockmint Beta.app"; fi
            test -d "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            executable="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")"
            smoke_home="$(mktemp -d "$RUNNER_TEMP/homebrew-smoke.XXXXXX")"
            env -i HOME="$smoke_home" TMPDIR="$RUNNER_TEMP/" \
              PATH=/usr/bin:/bin:/usr/sbin:/sbin LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 \
              USER=dockmint-homebrew-smoke LOGNAME=dockmint-homebrew-smoke \
              DOCKMINT_TEST_SUITE=1 DOCKMINT_DEBUG_LOG=0 \
              "$executable" -ApplePersistenceIgnoreState YES &
            pid=$!
            sleep 3
            kill -0 "$pid"
            kill -TERM "$pid"
            wait "$pid" || true
            brew uninstall --cask "$installed_cask"
            installed_cask=''
            test ! -e "$app"
          done

  prepare-homebrew-publication:
    needs:
      - prepare
      - generate-homebrew-casks
      - validate-homebrew-casks
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Download exact casks validated on both native runners
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reviewed-homebrew-casks
          path: reviewed-casks
      - name: Seal standard Homebrew publication bundle
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          casks="$(find reviewed-casks -maxdepth 1 -type f -exec basename {} \; | LC_ALL=C sort | paste -sd ' ' -)"
          [[ "$casks" == 'dockmint.rb dockmint@beta.rb' ]]
          gh release view "$TAG" --json assets > release-assets.json
          channel=stable
          [[ "$TAG" == *-beta.* ]] && channel=beta
          python3 scripts/release/build_homebrew_publication.py \
            --channel "$channel" --tag "$TAG" \
            --casks reviewed-casks --release-assets release-assets.json \
            --output publication
          (
            cd publication
            find manifest.json Casks -type f -print0 |
              LC_ALL=C sort -z |
              xargs -0 sha256sum > SHA256SUMS
            sha256sum --check --strict SHA256SUMS
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf ../homebrew-publication.tar.gz manifest.json SHA256SUMS Casks
          )

      - name: Verify exact pre-published attested bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir existing-bundle
          gh release download "$TAG" --pattern homebrew-publication.tar.gz --dir existing-bundle
          cmp homebrew-publication.tar.gz existing-bundle/homebrew-publication.tar.gz
          gh attestation verify existing-bundle/homebrew-publication.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Upload Homebrew publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dockmint-homebrew-publication-${{ needs.prepare.outputs.tag }}
          path: |
            publication
            homebrew-publication.tar.gz
          if-no-files-found: error
          retention-days: 14

  dispatch-homebrew-publication:
    needs:
      - prepare
      - prepare-homebrew-publication
    permissions:
      contents: read
    environment: homebrew-dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Mint dispatch-only tap token
        id: dispatcher
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2
        with:
          app-id: ${{ vars.HOMEBREW_DISPATCHER_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_DISPATCHER_PRIVATE_KEY }}
          owner: apotenza92
          repositories: homebrew-tap
          permission-actions: write
      - name: Dispatch trusted publication
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TAP_REPOSITORY: apotenza92/homebrew-tap
        run: |
          set -euo pipefail
          correlation="${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${TAG}"
          jq -n --arg product dockmint --arg tag "$TAG" --arg release_commit "$GITHUB_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg correlation_id "$correlation" \
            '{ref:"main",inputs:{product:$product,tag:$tag,release_commit:$release_commit,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,correlation_id:$correlation_id}}' |
            gh api --method POST "repos/$TAP_REPOSITORY/actions/workflows/publish-homebrew.yml/dispatches" --input -
